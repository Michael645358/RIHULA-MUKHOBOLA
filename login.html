<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member Login</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-box">
    <div>
        <img src="images/logo.jpg" alt="Logo" width="100">
    </div>

    <h2>Member Login</h2>

    <p style="margin-bottom:15px;">
        <a href="admin-login.html">Admin Login</a>
    </p>

    <div class="security-notice">
        <h3>Secure Member Login</h3>
        <p>
            This login page is only for registered members of
            RIHULA MUKHOBOLA ASSOCIATION.
        </p>
    </div>

    <div class="input-group">
        <input
            type="email"
            id="loginId"
            placeholder="📧 Email address"
            autocomplete="username">
    </div>

    <div class="input-group">
        <input
            type="password"
            id="password"
            placeholder="🔒 Password"
            autocomplete="current-password">
    </div>

    <button onclick="login()" class="login-btn">Login</button>

    <div class="links">
        <a href="forgot-password.html">Forgot Password?</a>
        <br><br>
        <a href="activate-account.html">Activate Existing Member Account</a>
        <br><br>
        <a href="register.html">Register Here</a>
    </div>
</div>

<script src="popups.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>
async function redirectMember(member) {
    localStorage.setItem("loggedUser", JSON.stringify(member));

    try {
        await db
            .from("members")
            .update({
                last_seen: new Date().toISOString(),
                online: true
            })
            .eq("id", member.id);
    } catch (e) {
        console.warn("Could not update member presence:", e);
    }

    // Member login is always a member session, even when the account
    // also has admin privileges. Admin access is controlled separately
    // by the PIN on admin-login.html.
    window.location.href = "member.html";
}

async function login() {
    const email = document.getElementById("loginId").value.trim().toLowerCase();
    const password = document.getElementById("password").value;

    if (!email || !password) {
        showPopup("Enter your email and password.", "warning");
        return;
    }

    if (!email.includes("@")) {
        showPopup("Member login uses email + password. Admin login uses the admin PIN.", "warning");
        return;
    }

    try {
        const { data: authData, error: authError } =
            await db.auth.signInWithPassword({
                email,
                password
            });

        if (authError) {
            console.error("EMAIL LOGIN ERROR:", authError);
            showPopup("Invalid email or password.", "error");
            return;
        }

        if (!authData || !authData.user) {
            showPopup("Login failed.", "error");
            return;
        }

        const { data: member, error: memberError } =
            await db
                .from("members")
                .select("*")
                .eq("auth_id", authData.user.id)
                .maybeSingle();

        if (memberError) {
            console.error("MEMBER LOOKUP ERROR:", memberError);
            await db.auth.signOut();
            showPopup("Your member account could not be loaded.", "error");
            return;
        }

        if (!member) {
            await db.auth.signOut();
            showPopup("This email is not linked to a RIHULA member account.", "warning");
            return;
        }

        if (member.status === "pending") {
            localStorage.setItem("loggedUser", JSON.stringify(member));
            window.location.href = "pending.html";
            return;
        }

        await redirectMember(member);

    } catch (error) {
        console.error("LOGIN ERROR:", error);
        showPopup("Unexpected login error. Please try again.", "error");
    }
}
</script>
<script src="v22.js"></script>
</body>
</html>
