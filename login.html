<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member Login</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="rihula-modern-design.css">
<link rel="stylesheet" href="rihula-v3-ui.css">
</head>
<body>

<div class="login-box">
    <div>
        <img src="images/logo.jpg" alt="Logo" width="100">
    </div>

    <h2>Member Login</h2>

    <p style="margin-bottom:15px;">
        <a href="admin-login.html">Admin Login</a>
    </p>

    <div class="security-notice">
        <h3>Secure Member Login</h3>
        <p>
            This login page is only for registered members of
            RIHULA MUKHOBOLA ASSOCIATION.
        </p>
    </div>

    <div class="input-group">
      <input
    type="text"
    id="loginId"
    placeholder="📧 Email or 📱 Phone number"
    autocomplete="username">
    </div>

    <div class="input-group">
        <input
            type="password"
            id="password"
            placeholder="🔒 Password"
            autocomplete="current-password">
    </div>

    <button onclick="login()" class="login-btn">Login</button>

    <div class="links">
        <a href="forgot-password.html">Forgot Password?</a>
        <br><br>
        <br><br>
        <a href="register.html">Register Here</a>
    </div>
</div>

<script src="popups.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="custom-auth.js"></script>
<script>
async function redirectMember(member) {
    localStorage.setItem("loggedUser", JSON.stringify(member));
    try {
        await db.from("members").update({
            last_seen: new Date().toISOString(),
            online: true
        }).eq("id", member.id);
    } catch (e) {
        console.warn("Could not update member presence:", e);
    }
    window.location.href = "member.html";
}

async function login() {
    const loginId = document.getElementById("loginId").value.trim();
    const password = document.getElementById("password").value;

    if (!loginId || !password) {
        showPopup("Enter your email/phone and password.", "warning");
        return;
    }

    const button = document.querySelector(".login-btn");
    if (button) { button.disabled = true; button.textContent = "Logging in..."; }

    try {
        const member = await RihulaCustomAuth.loginMember(loginId, password);

        if (member.status === "pending") {
            window.location.href = "pending-members.html";
            return;
        }

        if (["blocked", "suspended", "inactive"].includes(String(member.status || "").toLowerCase())) {
            RihulaCustomAuth.clearSession();
            showPopup("Your RIHULA account is currently inactive. Please contact an administrator.", "warning");
            return;
        }

        await redirectMember(member);
    } catch (error) {
        console.error("CUSTOM LOGIN ERROR:", error);
        showPopup(error.message || "Invalid email/phone or password.", "error");
    } finally {
        if (button) { button.disabled = false; button.textContent = "Login"; }
    }
}
</script>
<script src="rihula-v3-ui.js"></script>
</body>
</html>
