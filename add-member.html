<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Member</title>

<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<div class="logo-area">
<img src="images/logo.jpg" alt="Logo">

<div>
<h1>Add Member</h1>
<p>RIHULA MUKHOBOLA ASSOCIATION</p>
</div>
</div>
</header>

<section class="admin-panel add-member-page">

    <div class="admin-card add-member-card">

        <div class="add-member-title">
            <h2>Add Member</h2>
            <p>Register a new RIHULA MUKHOBOLA ASSOCIATION member</p>
        </div>

        <div class="member-form">

            <div class="form-group">
                <label for="memberName">Full Name</label>
                <input
                    type="text"
                    id="memberName"
                    placeholder="Enter member's full name"
                    autocomplete="name">
            </div>

            <div class="form-group">
                <label for="memberPhone">Phone Number</label>
                <input
                    type="tel"
                    id="memberPhone"
                    placeholder="e.g. 0712345678"
                    autocomplete="tel">
            </div>

            <div class="form-group">
                <label for="memberPassword">Password</label>
                <input
                    type="password"
                    id="memberPassword"
                    placeholder="Create member password"
                    autocomplete="new-password">
            </div>

            <div class="form-group">
                <label for="answer1">Village Where Member Was Born</label>
                <input
                    type="text"
                    id="answer1"
                    placeholder="Enter village">
            </div>

            <div class="form-group">
                <label for="answer2">Primary School Attended</label>
                <input
                    type="text"
                    id="answer2"
                    placeholder="Enter primary school">
            </div>

            <div class="form-group">
                <label for="idNumber">National ID Number</label>
                <input
                    type="text"
                    id="idNumber"
                    placeholder="Enter National ID number"
                    inputmode="numeric">
            </div>

            <button
                type="button"
                onclick="addMember()"
                class="btn add-member-submit">
                Add Member
            </button>

            <button
                type="button"
                onclick="history.back()"
                class="btn back-dashboard-btn">
                ← Back to Dashboard
            </button>

        </div>

    </div>

</section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="script.js"></script>

<script src="popups.js"></script>

<script src="v22.js"></script>
</body>
</html>
