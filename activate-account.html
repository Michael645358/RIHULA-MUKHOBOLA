<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activate Member Account</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-box">
    <img src="images/logo.jpg" alt="Logo" width="100">

    <h2>Activate Your Account</h2>
    <p>Existing members can activate their account without registering again.</p>

    <br>

    <div class="input-group">
        <input type="tel" id="phone" placeholder="📱 Existing Phone Number" autocomplete="tel">
    </div>

    <div class="input-group">
        <input type="password" id="oldPassword" placeholder="🔒 Existing Password" autocomplete="current-password">
    </div>

    <div class="input-group">
        <input type="email" id="email" placeholder="📧 New Email Address" autocomplete="email">
    </div>

    <div class="input-group">
        <input type="password" id="newPassword" placeholder="🔐 Create New Password" autocomplete="new-password">
    </div>

    <div class="input-group">
        <input type="password" id="confirmPassword" placeholder="🔐 Confirm New Password" autocomplete="new-password">
    </div>

    <button onclick="activateAccount()" class="login-btn">Activate Account</button>

    <br><br>
    <a href="login.html">← Back to Login</a>
</div>

<script src="popups.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>
async function activateAccount() {
    const phone = document.getElementById("phone").value.trim();
    const oldPassword = document.getElementById("oldPassword").value;
    const email = document.getElementById("email").value.trim().toLowerCase();
    const newPassword = document.getElementById("newPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (!phone) {
        showPopup("Enter your existing phone number.", "warning");
        return;
    }

    if (!oldPassword) {
        showPopup("Enter your existing password.", "warning");
        return;
    }

    if (!email || !email.includes("@")) {
        showPopup("Enter a valid email address.", "warning");
        return;
    }

    if (newPassword.length < 6) {
        showPopup("New password must be at least 6 characters.", "warning");
        return;
    }

    if (newPassword !== confirmPassword) {
        showPopup("New passwords do not match.", "warning");
        return;
    }

    try {
        /*
         * 1. Confirm that the phone belongs to an existing member.
         *    The existing password is checked securely by the RPC below.
         */
        const { data: oldMember, error: memberCheckError } = await db
            .from("members")
            .select("id, phone, email, auth_id")
            .eq("phone", phone)
            .maybeSingle();

        if (memberCheckError) {
            console.error(memberCheckError);
            showPopup(
                "Could not check the member record:\n\n" +
                memberCheckError.message,
                "error"
            );
            return;
        }

        if (!oldMember) {
            showPopup("No member was found with that phone number.", "error");
            return;
        }

        if (oldMember.auth_id) {
            showPopup(
                "This member already has an email account. Use Email Login or Forgot Password.",
                "warning"
            );
            return;
        }

        /*
         * 2. Tell Supabase exactly where the confirmation email must return.
         *    This works both on localhost and on the deployed GitHub Pages site.
         */
        const emailRedirectTo =
            new URL("auth-confirm.html", window.location.href).href;

        /*
         * 3. Create the Supabase Auth account.
         */
        const { data: authData, error: authError } =
            await db.auth.signUp({
                email,
                password: newPassword,
                options: {
                    emailRedirectTo
                }
            });

        if (authError) {
            console.error("ACTIVATION AUTH ERROR:", authError);

            let message = authError.message;

            if (/already registered|already been registered|user already exists/i.test(message)) {
                message =
                    "This email address already has a Supabase login. " +
                    "If this was from an earlier activation attempt, use that email and password on the Login page. " +
                    "If it is not linked to this member yet, contact the administrator.";
            }

            showPopup(
                "Could not create the email account:\n\n" + message,
                "error"
            );
            return;
        }

        if (!authData || !authData.user) {
            showPopup("Could not create the login account.", "error");
            return;
        }

        /*
         * 4. Link the new Auth account to the EXISTING member.
         *    The database function checks phone + old password.
         */
        const { data: result, error: rpcError } =
            await db.rpc("activate_old_member", {
                p_phone: phone,
                p_old_password: oldPassword,
                p_email: email,
                p_auth_id: authData.user.id
            });

        if (rpcError) {
            console.error("ACTIVATION LINK ERROR:", rpcError);
            showPopup(
                "The email account was created, but linking failed:\n\n" +
                rpcError.message,
                "error"
            );
            return;
        }

        if (!result || !result.success) {
            showPopup(
                (result && result.message) ||
                "The existing member could not be activated.",
                "error"
            );
            return;
        }

        await db.auth.signOut();

        /*
         * If email confirmation is enabled, the member will receive a
         * confirmation email and return through auth-confirm.html.
         * If confirmation is disabled, they can log in immediately.
         */
        showPopup(
            "Account activated successfully!\n\n" +
            "Your existing savings and contribution history were preserved.\n\n" +
            "Check your email if Supabase asks you to confirm it. " +
            "Then log in using your new email and password.",
            "success"
        );

        setTimeout(() => {
            window.location.href = "login.html";
        }, 1800);

    } catch (error) {
        console.error("ACTIVATION ERROR:", error);
        showPopup(
            "Unexpected activation error:\n\n" + error.message,
            "error"
        );
    }
}
</script>
</body>
</html>
