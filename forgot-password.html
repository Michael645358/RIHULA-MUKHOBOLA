<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="reset-card">
    <img src="images/logo.jpg" class="reset-logo" alt="RIHULA Logo">

    <h2>🔒 Reset Password</h2>

    <p>
        Enter your email if you have activated an email account.
        Older members can use phone + ID verification.
    </p>

    <input type="text" id="loginId"
           placeholder="Email or Phone Number"
           autocomplete="username">

    <div id="legacyFields">
        <input type="text" id="idNumber"
               placeholder="National ID Number">
    </div>

    <input type="password" id="newPassword"
           placeholder="New Password">

    <input type="password" id="confirmPassword"
           placeholder="Confirm New Password">

    <button onclick="resetPassword()">Reset Password</button>

    <p style="margin-top:15px;">
        <a href="login.html">← Back to Login</a>
    </p>
</div>

<script src="popups.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>
const loginIdInput = document.getElementById("loginId");
const legacyFields = document.getElementById("legacyFields");

loginIdInput.addEventListener("input", () => {
    legacyFields.style.display =
        loginIdInput.value.includes("@") ? "none" : "block";
});

async function resetPassword() {
    const loginId = loginIdInput.value.trim().toLowerCase();
    const idNumber = document.getElementById("idNumber").value.trim();
    const newPassword = document.getElementById("newPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (!loginId) {
        showPopup("Enter your email or phone number.", "warning");
        return;
    }

    if (loginId.includes("@")) {
        if (newPassword.length < 6) {
            showPopup("New password must be at least 6 characters.", "warning");
            return;
        }

        if (newPassword !== confirmPassword) {
            showPopup("Passwords do not match.", "warning");
            return;
        }

        try {
            const redirectTo =
                new URL("reset-password.html", window.location.href).href;

            const { error } = await db.auth.resetPasswordForEmail(
                loginId,
                { redirectTo }
            );

            if (error) {
                showPopup(
                    "Could not send reset email:\n\n" + error.message,
                    "error"
                );
                return;
            }

            showPopup(
                "Password reset email sent.\n\n" +
                "Open the email and follow the reset link to create your new password.",
                "success"
            );

        } catch (error) {
            showPopup("Unexpected error:\n\n" + error.message, "error");
        }

        return;
    }

    /* Legacy phone reset */
    if (!idNumber) {
        showPopup("Enter your National ID number.", "warning");
        return;
    }

    if (newPassword.length < 6) {
        showPopup("New password must be at least 6 characters.", "warning");
        return;
    }

    if (newPassword !== confirmPassword) {
        showPopup("Passwords do not match.", "warning");
        return;
    }

    const { data: member, error: findError } = await db
        .from("members")
        .select("id")
        .eq("phone", loginId)
        .eq("id_number", idNumber)
        .maybeSingle();

    if (findError || !member) {
        showPopup("Phone number and ID number do not match.", "error");
        return;
    }

    const { error: updateError } = await db
        .from("members")
        .update({ password: newPassword })
        .eq("id", member.id);

    if (updateError) {
        showPopup(
            "Could not reset the legacy password:\n\n" +
            updateError.message,
            "error"
        );
        return;
    }

    showPopup(
        "Password reset successfully.\n\n" +
        "You can now log in using your phone number.",
        "success"
    );

    setTimeout(() => {
        window.location.href = "login.html";
    }, 1200);
}
</script>

</body>
</html>
