<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password</title>

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="reset-card">

<img src="images/logo.png" class="reset-logo">

<h2>🔒 Reset Password</h2>

    <p>Verify your identity before resetting your password.</p>

    <input type="tel" id="phone" placeholder="Phone Number">

    <input type="text" id="idNumber" placeholder="National ID Number">

<input
    type="password"
    id="newPassword"
    placeholder="New Password">

<input
    type="password"
    id="confirmPassword"
    placeholder="Confirm New Password">

<label style="display:block;margin:10px 0;">
    <input
        type="checkbox"
        onclick="toggleResetPassword()">
    Show Passwords
</label>

    <button onclick="resetPassword()">
        Reset Password
    </button>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>

const db = window.db;

function showToast(message, type="success"){

const toast=document.getElementById("toast");

toast.innerText=message;

toast.className="toast "+type+" show";

setTimeout(()=>{
toast.className="toast";
},3000);

}

async function resetPassword() {

    const phone = document.getElementById("phone").value.trim();
    const idNumber = document.getElementById("idNumber").value.trim();
    const newPassword = document.getElementById("newPassword").value.trim();
    
    const confirmPassword =
    document.getElementById("confirmPassword").value.trim();

if (newPassword !== confirmPassword) {
    alert("Passwords do not match.");
    return;
}

    if (!phone || !idNumber || !newPassword || !confirmPassword) {
    alert("Please fill all fields.");
    return;
}

    // Find member using phone number and ID number
    const { data, error } = await db
        .from("members")
        .select("*")
        .eq("phone", phone)
        .eq("id_number", idNumber)
        .single();

    if (error || !data) {
        showToast("Phone number or ID number is incorrect.","error");
        return;
    }

if (newPassword === data.password) {
    alert("Your new password cannot be the same as your current password.");
    return;
}

    // Update password
    const { error: updateError } = await db
        .from("members")
        .update({
            password: newPassword
        })
        .eq("id", data.id);

    if (updateError) {
        alert(updateError.message);
        return;
    }

    showToast("Password reset successfully.", "success");

setTimeout(() => {
    window.location.href = "login.html";
}, 2000);
}
function toggleResetPassword() {

    const password =
        document.getElementById("newPassword");

    const confirm =
        document.getElementById("confirmPassword");

    const type =
        password.type === "password"
        ? "text"
        : "password";

    password.type = type;
    confirm.type = type;
}
</script>

<div id="toast" class="toast"></div>

</body>
</html>
