<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Association Chat</title>

<link rel="stylesheet" href="style.css">

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}

header{
    background:#0b6623;
    color:white;
    padding:15px;
    display:flex;
    align-items:center;
    gap:15px;
}

header button{
    background:white;
    color:#0b6623;
    border:none;
    padding:8px 14px;
    border-radius:8px;
    cursor:pointer;
}

#onlineMembers{
    background:#fff;
    padding:10px;
    border-bottom:1px solid #ddd;
    font-size:14px;
}

#chatMessages{
    height:65vh;
    overflow-y:auto;
    padding:15px;
}

.chatInput{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:white;
    display:flex;
    padding:10px;
    gap:10px;
    box-shadow:0 -2px 10px rgba(0,0,0,.1);
}

.chatInput input{
    flex:1;
    padding:12px;
    border-radius:25px;
    border:1px solid #ccc;
}

.chatInput button{
    padding:12px 20px;
    border:none;
    border-radius:25px;
    background:#0b6623;
    color:white;
}
</style>

</head>

<body>

<header>

<button onclick="history.back()">⬅ Back</button>

<h2>Association Chat</h2>

</header>

<div id="onlineMembers">
Loading online members...
</div>

<div id="chatMessages">
</div>

<div class="chatInput">

<input
id="chatMessage"
placeholder="Type a message...">

<button onclick="sendMessage()">
Send
</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/chat.js"></script>
<script src="popups.js"></script>

</body>
</html>
