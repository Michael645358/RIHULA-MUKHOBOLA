<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create New Password | RIHULA</title>
<link rel="stylesheet" href="auth-pages.css">
<link rel="stylesheet" href="rihula-modern-design.css">
<link rel="stylesheet" href="rihula-v3-ui.css">
</head>
<body class="auth-page">
<div class="auth-wrapper">
<main class="auth-card">
<img src="images/logo.jpg" class="auth-logo" alt="RIHULA Mukhobola Youths Association">
<header class="auth-header">
<h1>🔐 Create New Password</h1>
<p>Enter and confirm your new RIHULA account password.</p>
</header>
<div class="auth-info" id="resetStatus" role="status">
<span class="auth-info-icon">🔄</span>
<div>Checking your secure password-reset session…</div>
</div>
<form class="auth-form" id="resetPasswordForm" hidden>
<div class="form-field">
<label for="newPassword">New Password</label>
<input type="password" id="newPassword" placeholder="Enter new password" autocomplete="new-password" minlength="6" required>
</div>
<div class="form-field">
<label for="confirmPassword">Confirm Password</label>
<input type="password" id="confirmPassword" placeholder="Confirm new password" autocomplete="new-password" minlength="6" required>
</div>
<button type="submit" class="auth-button" id="savePasswordButton">Save New Password</button>
</form>
<div class="auth-footer"><a href="login.html">← Back to Login</a></div>
</main>
</div>
<script src="popups.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script>
(function () {
    const status = document.getElementById("resetStatus");
    const form = document.getElementById("resetPasswordForm");
    if (form) form.hidden = true;
    if (status) status.innerHTML = '<span class="auth-info-icon">ℹ️</span><div>Supabase Auth password recovery is disabled temporarily. Please return to Login and contact a RIHULA administrator for a password reset.</div>';
})();
</script>
<script src="rihula-v3-ui.js"></script>
</body>
</html>
