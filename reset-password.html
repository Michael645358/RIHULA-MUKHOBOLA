<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create New Password</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-box">
    <img src="images/logo.jpg" alt="RIHULA Logo" width="100">

    <h2>🔐 Create New Password</h2>

    <p>Enter your new password below.</p>

    <div class="input-group">
        <input type="password" id="newPassword"
               placeholder="New Password"
               autocomplete="new-password">
    </div>

    <div class="input-group">
        <input type="password" id="confirmPassword"
               placeholder="Confirm New Password"
               autocomplete="new-password">
    </div>

    <button onclick="saveNewPassword()" class="login-btn">
        Save New Password
    </button>

    <br><br>
    <a href="login.html">← Back to Login</a>
</div>

<script src="popups.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>
async function saveNewPassword() {
    const password = document.getElementById("newPassword").value;
    const confirm = document.getElementById("confirmPassword").value;

    if (password.length < 6) {
        showPopup("Password must be at least 6 characters.", "warning");
        return;
    }

    if (password !== confirm) {
        showPopup("Passwords do not match.", "warning");
        return;
    }

    const { error } = await db.auth.updateUser({
        password
    });

    if (error) {
        showPopup(
            "Could not update password:\n\n" + error.message,
            "error"
        );
        return;
    }

    await db.auth.signOut();

    showPopup(
        "Password updated successfully. You can now log in.",
        "success"
    );

    setTimeout(() => {
        window.location.href = "login.html";
    }, 1200);
}
</script>

</body>
</html>
